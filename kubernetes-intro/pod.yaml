apiVersion: v1
kind: Pod
metadata:
  name: homework
  namespace: homework
spec:

  initContainers:
  - name: html-generator
    image: busybox:1.36
    command: ['sh', '-c', 'echo "<h1>Hello from Init Container!</h1>" > /init/index.html']
    volumeMounts:
    - name: web-data
      mountPath: /init

  containers:
  - name: web-server
    image: python:3.11-slim
    command: ['sh', '-c', 'cd /homework && python3 -m http.server 8000']
    ports:
    - containerPort: 8000
    volumeMounts:
    - name: web-data
      mountPath: /homework

    lifecycle:
      preStop:
        exec:
          command: ['sh', '-c', 'rm -f /homework/index.html']

  volumes:
  - name: web-data
    emptyDir: {}
